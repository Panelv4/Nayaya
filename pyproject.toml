[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayacode"
version = "0.4.0"
description = "Rules-as-code statute analysis: encode a law, find the gaps, measure an amendment. Plus a citizen case-reporting prototype built on it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NYAYA-RAC contributors" }]
keywords = ["law", "rules-as-code", "legal-tech", "statute", "python", "india", "bharatiya-nyaya-sanhita"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Standard library only — there is nothing to install. The portal and the
# nyayacode library both run on a bare Python 3.10+ interpreter.
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
nyayacode = "nyayacode.cli:main"

[project.urls]
Homepage = "https://github.com/Panelv4/Nayaya"
Repository = "https://github.com/Panelv4/Nayaya"

[tool.setuptools]
py-modules = []
packages = ["nyayacode"]

[tool.setuptools.package-data]
nyayacode = ["packs/**/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
